<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Milan · Stage</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%AA%94%3C/text%3E%3C/svg%3E">
  <style>
    body { overflow: hidden; }
    .stage { display: grid; gap: 14px; padding: 16px; height: calc(100vh - 90px);
             grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); grid-auto-rows: 1fr; }
    .lane { background: var(--panel); border-radius: var(--radius); padding: 18px 22px; display: flex;
            flex-direction: column; border-top: 6px solid var(--marigold); overflow: hidden; }
    .lane:nth-child(3n+2) { border-top-color: var(--sindoor); }
    .lane:nth-child(3n) { border-top-color: var(--leaf); }
    .lane h2 { margin: 0 0 8px; font-size: 1rem; color: var(--muted); letter-spacing: .04em; }
    .lane .who { color: var(--marigold); font-weight: 700; }
    .lane h2 { font-size: clamp(1rem, 1.4vw, 1.4rem); }
    .lane .who { font-size: clamp(1rem, 1.4vw, 1.4rem); }
    .lane .prev { font-size: clamp(1.1rem, 1.8vw, 1.8rem); line-height: 1.3; opacity: .45; margin-top: 6px; }
    .lane .line { font-size: clamp(1.8rem, 3.4vw, 3.6rem); line-height: 1.3; font-weight: 600; margin-top: 8px; }
    .lane .line.fresh { animation: fadein .7s ease both; }
    @keyframes fadein { from { opacity: 0; transform: translateY(14px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
    .joinqr { position: fixed; right: 16px; bottom: 16px; z-index: 5; background: var(--panel); border: 1px solid var(--marigold);
              border-radius: 16px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
              box-shadow: 0 8px 30px rgba(0,0,0,.5); }
    .joinqr .qrbox { padding: 6px; }
    .joinqr span { font-weight: 700; font-size: .9rem; color: var(--marigold); }
    @media (max-width: 600px) { body { overflow: auto; } .stage { height: auto; grid-auto-rows: minmax(180px, auto); }
      .stage { grid-template-columns: 1fr; } .joinqr { display: none; } }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; }
  </style>
</head>
<body>
  <div class="toran"></div>
  <div class="bar">
    <h1 style="font-size:1.8rem;margin:0">मिलन <span>Milan</span> · <span id="room" class="muted" style="color:var(--muted)"></span></h1>
    <span id="rushPill" class="pill" style="display:none">⚡ Rush mode: captions only</span>
  </div>
  <main class="stage" id="stage"></main>
  <aside class="joinqr" aria-label="Scan to join this room">
    <div id="stageQr" class="qrbox" role="img" aria-label="QR code to join this room"></div>
    <span>📱 Scan to join</span>
  </aside>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/static/stage.js" type="module"></script>
</body>
</html>
